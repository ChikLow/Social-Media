<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <title>{% block title %} Сайт {% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <style>
        footer {
            text-align: center;
            padding: 10px;
            color: grey;
        }

        .like-anim {
            animation: pop .28s ease;
        }

        @keyframes pop {
            0% {
                transform: scale(.9);
                opacity: .7;
            }

            50% {
                transform: scale(1.08);
                opacity: 1;
            }

            100% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body data-bs-theme="dark" style="background-color: #121212;color:white">
    <div class="container mt-4 content-wrapper">
        {% block content %}

        {% endblock %}
    </div>

    <footer>© 2025 SocialGram from Roma</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
    <script>
function getCsrf() {
    const m = document.querySelector('meta[name="csrf-token"]');
    return m ? m.getAttribute('content') : '';
}

function toggleLike(postId, event) {
    if (event && typeof event.preventDefault === 'function') event.preventDefault();

    fetch(`/posts/${postId}/like/`, {
        method: 'POST',
        headers: {
            'X-Requested-With': 'XMLHttpRequest',
            'X-CSRFToken': getCsrf(),
            'Accept': 'application/json'
        }
    })
    .then(response => {
        if (!response.ok) throw new Error('Network response was not ok');
        return response.json();
    })
    .then(data => {
        const heart = data.is_liked ? '❤️' : '🤍';

        // card elements (feed)
        const iconCard = document.getElementById(`like-icon-${postId}`);
        const countCard = document.getElementById(`like-count-${postId}`);

        if (iconCard) iconCard.textContent = heart;
        if (countCard) {
            countCard.textContent = data.like_count;
            countCard.classList.remove('like-anim');
            void countCard.offsetWidth;
            countCard.classList.add('like-anim');
        }

        // detail element (contains both icon and count)
        const detail = document.getElementById(`like-count-detail-${postId}`);
        if (detail) {
            detail.textContent = `${heart} ${data.like_count}`;
            detail.classList.remove('like-anim');
            void detail.offsetWidth;
            detail.classList.add('like-anim');
        }
    })
    .catch(err => console.error('Like error:', err));
}
</script>
</body>

</html>
