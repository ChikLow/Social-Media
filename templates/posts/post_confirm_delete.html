{% extends 'base.html' %}

{% block title %}Видалити пост{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="alert alert-warning">
    <h4>Видалити цей пост?</h4>
    <p>Цю дію неможливо скасувати.</p>
  </div>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Видалити</button>
    <a href="{% url 'post_detail' post.author.username post.id %}" class="btn btn-secondary">Скасувати</a>
  </form>
</div>
{% endblock %}
